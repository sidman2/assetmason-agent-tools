name: ci

on:
  push:
    branches: [main, am-foss-resource-plan-preview]
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify:public

  historical-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/historical-validation-replay.mjs --count 20 --out historical-validation.jsonl
      - run: node scripts/summarize-validation.mjs historical-validation.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: historical-validation-replay
          path: historical-validation.jsonl
